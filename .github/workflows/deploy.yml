name: Deploy Vook

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "========== Vook Deployment Started =========="

            cd /var/www/vook

            echo "Pull latest code..."
            git fetch origin
            git reset --hard origin/main

            #############################
            # Backend
            #############################

            echo "Installing backend dependencies..."
            cd backend
            npm install

            echo "Building backend..."
            npm run build

            if pm2 describe vook-backend > /dev/null; then
              echo "Restarting backend..."
              pm2 restart vook-backend
            else
              echo "Starting backend..."
              pm2 start dist/index.js --name vook-backend
            fi

            #############################
            # Frontend
            #############################

            echo "Installing frontend dependencies..."
            cd ../frontend
            npm install

            echo "Building frontend..."
            npm run build

            #############################
            # Save PM2
            #############################

            pm2 save

            echo "========== Deployment Completed =========="